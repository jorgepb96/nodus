name: Presenter native controller — Windows and Linux
# Automatic validation is selected by CI; this entry point is explicitly manual.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: presenter-manual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-controller:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install controller test dependencies
        run: npm ci --ignore-scripts
      - name: Materialize the verified Electron runtime
        run: node scripts/prepare-electron-tests.mjs
      - name: Verify encrypted native controller and PDF previews in Electron
        run: node scripts/verify-presenter-lan.cjs
