name: Website

# Automatic validation is selected by CI. Besides manual runs, one daily deploy
# keeps the release download counters that the README and the site read current.
on:
  schedule:
    # 23:00 UTC is midnight in Spain in winter (01:00 in summer).
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Manual and scheduled runs must deploy the canonical branch, never a
          # stale website snapshot from whichever branch opened the workflow UI.
          ref: main
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Generate static blog pages, feed and sitemap
        run: npm run blog:build

      - name: Refresh shared release download totals
        # Refresh the deployed artifact on every run. main requires a signed PR,
        # so generated website data must not be committed directly to it.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/github-release-downloads.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Prepare and verify the Pages artifact
        run: npm run site:artifact

      - name: Package the static website
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages-artifact

      - name: Deploy the website
        id: deployment
        uses: actions/deploy-pages@v5
