name: Scheme scan

# Automatic validation is selected by CI; this entry point is explicitly manual.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install chemistry test dependencies
        run: python -m pip install -r tools/scheme-scan/requirements-ci.txt
      - name: Check syntax and chemistry regressions
        run: |
          python -m compileall -q tools/scheme-scan
          python -m unittest discover -s tools/scheme-scan/tests -v
