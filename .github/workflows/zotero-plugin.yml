name: Zotero plugin

# Pull requests run these checks in CI's Zotero module lane
# (scripts/ci-modules.mjs), so the required gate covers them. This workflow
# stays for an on-demand plugin build.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zotero-plugin-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  plugin:
    name: Plugin tests and XPI packaging
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies without native app build hooks
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test plugin behavior and release packaging contracts
        run: node --test scripts/test-zotero-plugin.mjs
      - name: Verify Harrier block-gather parity (sequential CPU sessions)
        run: node --test --test-concurrency=1 scripts/test-zotero-harrier-graph.mjs
      - name: Build the installable Zotero plugin
        run: npm run zotero:xpi
      - uses: actions/upload-artifact@v7
        with:
          name: nodus-zotero-plugin
          path: |
            dist-zotero/nodus-zotero.xpi
            dist-zotero/updates.json
          if-no-files-found: error
          retention-days: 7
