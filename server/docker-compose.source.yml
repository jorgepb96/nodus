# Build Nodus Server from THIS checkout instead of pulling a published image.
#
# The `ghcr.io/jorgepb96/nodus-server` tags are only built from `main`, so a branch under
# review has no image to pull. Use this file to run exactly the code you have checked out —
# for testing a branch, or for an air-gapped install that cannot reach GHCR.
#
#   docker compose -f docker-compose.source.yml up -d --build
#
# Everything else matches docker-compose.yml: the port is bound to loopback, and Caddy is
# behind the `proxy` profile so an existing reverse proxy is not disturbed.

services:
  nodus-server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: nodus-server:source
    restart: unless-stopped
    environment:
      NODUS_PUBLIC_URL: ${NODUS_PUBLIC_URL}
      NODUS_TRUST_PROXY: "1"
      NODUS_DEPLOYMENT_MODE: advanced
      NODUS_AI_KEYRING_FILE: ${NODUS_AI_KEYRING_FILE:-}
      NODUS_AI_MAX_ACTIVE_PER_USER: ${NODUS_AI_MAX_ACTIVE_PER_USER:-}
      NODUS_AI_MAX_ACTIVE_GLOBAL: ${NODUS_AI_MAX_ACTIVE_GLOBAL:-}
      NODUS_ADMIN_EMAIL: ${NODUS_ADMIN_EMAIL:-}
      NODUS_ADMIN_PASSWORD: ${NODUS_ADMIN_PASSWORD:-}
      NODUS_SETUP_TOKEN: ${NODUS_SETUP_TOKEN:-}
      NODUS_SOURCE_URL: ${NODUS_SOURCE_URL:-https://github.com/jorgepb96/nodus/tree/v5.8.1}
      # Optional ceilings. Left unset they default to 8 MiB per image, 2 GiB of images per
      # space, and the snapshot limits documented in the README.
      NODUS_MAX_ASSET_BYTES: ${NODUS_MAX_ASSET_BYTES:-}
      NODUS_MAX_SPACE_ASSET_BYTES: ${NODUS_MAX_SPACE_ASSET_BYTES:-}
      NODUS_MAX_SNAPSHOT_BYTES: ${NODUS_MAX_SNAPSHOT_BYTES:-}
      NODUS_MAX_SNAPSHOT_JSON_BYTES: ${NODUS_MAX_SNAPSHOT_JSON_BYTES:-}
      # How much expanded publication stays parsed in memory, 128 MiB by default.
      NODUS_MAX_SNAPSHOT_CACHE_BYTES: ${NODUS_MAX_SNAPSHOT_CACHE_BYTES:-}
      # What a collaborator may send back: 256 KiB per row, 16 MiB per request, and 256 MiB
      # of changes held per space while the owner is away. Raise the first two together.
      NODUS_MAX_MUTATION_BYTES: ${NODUS_MAX_MUTATION_BYTES:-}
      NODUS_MAX_MUTATION_BATCH_BYTES: ${NODUS_MAX_MUTATION_BATCH_BYTES:-}
      NODUS_MAX_LEDGER_BYTES: ${NODUS_MAX_LEDGER_BYTES:-}
      NODUS_MAX_SPACE_DOCUMENT_UPDATE_BYTES: ${NODUS_MAX_SPACE_DOCUMENT_UPDATE_BYTES:-}
      NODUS_MAX_SPACE_SHARED_BLOB_BYTES: ${NODUS_MAX_SPACE_SHARED_BLOB_BYTES:-}
      NODUS_MAX_SPACE_PARTIAL_BLOB_BYTES: ${NODUS_MAX_SPACE_PARTIAL_BLOB_BYTES:-}
      # Threads for semantic search. Unset is one, or two where there are cores spare.
      NODUS_VECTOR_WORKERS: ${NODUS_VECTOR_WORKERS:-}
    volumes:
      - nodus_data:/data
    ports:
      - "127.0.0.1:7443:7443"

  caddy:
    image: caddy:2-alpine
    profiles: ["proxy"]
    restart: unless-stopped
    depends_on: [nodus-server]
    environment:
      NODUS_DOMAIN: ${NODUS_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  nodus_data:
  caddy_data:
  caddy_config:
