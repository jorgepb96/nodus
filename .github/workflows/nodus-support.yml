name: Nodus Support safety and native UI
on:
  pull_request:
    paths: ['apps/nodus-support/**','shared/**','electron/**','src/theme/**','scripts/*nodus-support*','scripts/support-*','scripts/configure-support-signing.mjs','scripts/lib/supportEvidence.mjs','package.json','package-lock.json','vite.config.ts','build/**','.github/workflows/nodus-support.yml']
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, macos-15-intel, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node node_modules/electron/install.js
      - name: Linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2 rpm clang-15
      - name: Build the native database and calendar dependencies
        if: runner.os != 'Linux'
        run: npx --no-install electron-rebuild -f -w better-sqlite3 && node scripts/build-apple-calendar.cjs
      - name: Build Linux native dependencies with the release compiler
        if: runner.os == 'Linux'
        run: npx --no-install electron-rebuild -f -w better-sqlite3
        env:
          CC: clang-15
          CXX: clang++-15
      - name: Prepare the Linux sandbox helper used by direct protocol workers
        if: runner.os == 'Linux'
        run: sudo chown root:root node_modules/electron/dist/chrome-sandbox && sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - run: npm run support:typecheck
      - run: npm run support:test
        env:
          NODUS_SUPPORT_LARGE_FILES: '1'
      - run: npm run support:build
      - name: Build the application bootstrap for the isolated native protocol
        run: npx vite build
      - name: Native support application, twelve languages, both themes
        if: runner.os != 'Linux'
        run: node scripts/verify-nodus-support-data.mjs && node scripts/verify-nodus-support-ui.mjs && node scripts/verify-nodus-support-protocol.mjs
      - name: Native Linux support application
        if: runner.os == 'Linux'
        run: xvfb-run -a sh -c 'node scripts/verify-nodus-support-data.mjs && node scripts/verify-nodus-support-ui.mjs && node scripts/verify-nodus-support-protocol.mjs'
      - name: Package every native support format
        run: npm run support:dist
      - name: Verify the independent packaged runtime
        if: runner.os != 'Linux'
        run: node scripts/verify-nodus-support-runtime.mjs
      - name: Verify the independent Linux runtime
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/verify-nodus-support-runtime.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nodus-support-${{ matrix.os }}
          path: |
            .ci/support-ui/
            .ci/support-native/
