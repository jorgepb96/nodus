name: Signed Nodus Support qualification
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
permissions:
  contents: read
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node node_modules/electron/install.js
      - name: Prepare temporary macOS signing keychain
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          required=(
            MACOS_CERTIFICATE_BASE64
            MACOS_CERTIFICATE_PASSWORD
            APPLE_API_KEY_BASE64
            APPLE_API_KEY_ID
            APPLE_API_ISSUER
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required macOS release secret is not configured: $name"
              exit 1
            fi
          done

          certificate_path="$RUNNER_TEMP/nodus-signing-certificate.p12"
          api_key_path="$RUNNER_TEMP/nodus-notary-api-key.p8"
          keychain_path="$RUNNER_TEMP/nodus-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          echo "::add-mask::$keychain_password"

          printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$api_key_path"
          chmod 600 "$certificate_path" "$api_key_path"
          openssl pkey -in "$api_key_path" -noout

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path" >/dev/null

          # codesign only resolves identities from the user's keychain search
          # list, even when --keychain is also supplied. Preserve the runner's
          # existing keychains while making this isolated one discoverable.
          search_keychains=("$keychain_path")
          while IFS= read -r existing_keychain; do
            if [[ -n "$existing_keychain" && "$existing_keychain" != "$keychain_path" ]]; then
              search_keychains+=("$existing_keychain")
            fi
          done < <(security list-keychains -d user | sed -E 's/^[[:space:]]*"([^"]+)".*/\1/')
          security list-keychains -d user -s "${search_keychains[@]}"

          signing_identities="$(security find-identity -v -p codesigning "$keychain_path")"
          if [[ "$signing_identities" != *'"Developer ID Application:'* ]]; then
            echo "::error::The imported .p12 does not contain a valid Developer ID Application identity and private key"
            exit 1
          fi

          # Fail before the expensive app build if codesign cannot use the
          # imported private key in this non-interactive runner session.
          identity_hash="$(awk '/"Developer ID Application:/ { print $2; exit }' <<< "$signing_identities")"
          signing_probe="$RUNNER_TEMP/nodus-codesign-probe"
          cp /usr/bin/true "$signing_probe"
          codesign --force \
            --sign "$identity_hash" \
            --keychain "$keychain_path" \
            --timestamp \
            --options runtime \
            "$signing_probe"
          codesign --verify --strict "$signing_probe"
          rm -f "$signing_probe"

          {
            echo "CSC_KEYCHAIN=$keychain_path"
            echo "APPLE_API_KEY=$api_key_path"
            echo "NODUS_MACOS_CERTIFICATE_PATH=$certificate_path"
            echo "NODUS_NOTARY_KEY_PATH=$api_key_path"
          } >> "$GITHUB_ENV"

      - name: Build signed and notarized independent candidate without publishing
        env:
          NODUS_SUPPORT_RELEASE: '1'
          CSC_IDENTITY_AUTO_DISCOVERY: 'true'
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npm run support:dist
      - name: Real signed bundle activation, launch and rollback
        env:
          NODUS_REQUIRE_MACOS_SIGNING: 'true'
        run: node scripts/verify-nodus-support-native-switch.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: support-signed-qualification-${{ matrix.os }}
          path: .ci/support-native/*-native-switch.json
          if-no-files-found: error
          retention-days: 3
      - name: Remove temporary macOS credentials
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          set +e
          keychain_path="${CSC_KEYCHAIN:-$RUNNER_TEMP/nodus-signing.keychain-db}"
          certificate_path="${NODUS_MACOS_CERTIFICATE_PATH:-$RUNNER_TEMP/nodus-signing-certificate.p12}"
          api_key_path="${NODUS_NOTARY_KEY_PATH:-$RUNNER_TEMP/nodus-notary-api-key.p8}"
          signing_probe="$RUNNER_TEMP/nodus-codesign-probe"
          security lock-keychain "$keychain_path" >/dev/null 2>&1
          security delete-keychain "$keychain_path" >/dev/null 2>&1
          rm -f "$certificate_path" "$api_key_path" "$keychain_path" "$signing_probe"

