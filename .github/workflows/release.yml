name: Stable release

# Stable keeps the existing vX.Y.Z tag flow. Prerelease tags are explicitly
# excluded so they can only enter the isolated beta workflow.
on:
  push:
    tags:
      - 'v*'
      - '!v*-*'
  workflow_dispatch:
    inputs:
      tag:
        description: Stable tag to publish (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish-stable:
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/release-build.yml
    with:
      channel: latest
      tag: ${{ inputs.tag || github.ref_name }}
    secrets: inherit
