name: PR checks

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft, closed]
  workflow_run:
    workflows: [CI, Contributor License Agreement]
    types: [completed]
  check_run:
    types: [completed]
  status:
  issue_comment:
    types: [created]
  push:
    branches: [main]
    paths:
      - .github/workflows/pr-checks.yml
      - scripts/pr-checks.mjs
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number (required when retrying failed CI jobs)'
        type: string
        required: false
      retry_failed:
        description: 'Retry failed CI jobs for this PR, then refresh PR checks'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  checks: read
  statuses: write
  issues: write
  pull-requests: write

jobs:
  retry:
    if: >-
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       github.event.comment.user.type == 'User' &&
       (github.event.comment.body == 'retry' || github.event.comment.body == '/retry' ||
        github.event.comment.body == '@github-actions retry')) ||
      (github.event_name == 'pull_request_target' && github.event.sender.type == 'User' &&
       contains(fromJSON('["edited", "reopened", "ready_for_review"]'), github.event.action)) ||
      (github.event_name == 'workflow_dispatch' && inputs.retry_failed)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only the retry job can restart CI. Reconciliation remains read-only
    # for Actions, and neither job executes PR code or downloads its artifacts.
    permissions:
      contents: read
      actions: write
      pull-requests: read
    concurrency:
      group: nodus-pr-retry-${{ github.event.issue.number || github.event.pull_request.number || inputs.pr_number }}
      cancel-in-progress: false
    outputs:
      accepted: ${{ steps.retry.outputs.accepted }}
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts/pr-checks.mjs
          sparse-checkout-cone-mode: false
      - name: Retry failed CI jobs for the current PR revision
        id: retry
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { retryFailedCi } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/pr-checks.mjs`);
            await retryFailedCi({ github, context, core });

  reconcile:
    needs: retry
    if: >-
      always() && !cancelled() &&
      (github.event_name != 'issue_comment' || needs.retry.outputs.accepted == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Reconcile all open PRs so replacing a pending event loses no PR updates.
    # Retry requests use their own per-PR queue and cannot be dropped by this one.
    concurrency:
      group: nodus-pr-checks
      cancel-in-progress: false
    steps:
      # Never check out a PR ref or execute code/artifacts supplied by a PR.
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts/pr-checks.mjs
          sparse-checkout-cone-mode: false
      - name: Verify linked issues and report completed checks
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { run } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/pr-checks.mjs`);
            await run({ github, context, core });
