name: Website

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/build-blog-pages.mjs'
      - 'scripts/build-blog-feed.mjs'
      - 'scripts/build-site-metadata.mjs'
      - 'scripts/build-sitemap.mjs'
      - 'scripts/build-pages-artifact.mjs'
      # The counters the README and the site read are written by this script, so a
      # change to it has to republish the deployed data instead of waiting for cron.
      - 'scripts/github-release-downloads.mjs'
      - 'scripts/lib/site-metadata.mjs'
      - 'package.json'
      - 'CITATION.cff'
      - '.github/workflows/pages.yml'
  schedule:
    # Keep one shared download-count cache on the site instead of making every
    # visitor fan out into individual GitHub API requests.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Manual and scheduled runs must deploy the canonical branch, never a
          # stale website snapshot from whichever branch opened the workflow UI.
          ref: main
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Generate static blog pages, feed and sitemap
        run: npm run blog:build

      - name: Refresh shared release download totals
        # Refresh the deployed artifact on every run. main requires a signed PR,
        # so generated website data must not be committed directly to it.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/github-release-downloads.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Prepare and verify the Pages artifact
        run: npm run site:artifact

      - name: Package the static website
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages-artifact

      - name: Deploy the website
        id: deployment
        uses: actions/deploy-pages@v5
