name: CI

# Build once, then run six Linux test shards and three E2E groups on isolated runners.
# Lint and TypeScript run alongside the build and remain required by the final gate.
# Complete coverage; native and specialized checks follow changed paths.
# Documentation has a fast lane. The final test job is an unconditional gate.
# Exact original configuration: .github/actions-budget/ (explicit restore only).
on:
  pull_request:
  merge_group:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

jobs:
  changes:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      full: ${{ steps.route.outputs.full }}
      light: ${{ steps.route.outputs.light }}
      macos: ${{ steps.route.outputs.macos }}
      windows: ${{ steps.route.outputs.windows }}
      research: ${{ steps.route.outputs.research }}
      scheme: ${{ steps.route.outputs.scheme }}
      server: ${{ steps.route.outputs.server }}
      appimage: ${{ steps.route.outputs.appimage }}
      presenter: ${{ steps.route.outputs.presenter }}
      matrix: ${{ steps.route.outputs.matrix }}
      selection: ${{ steps.route.outputs.selection }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate every workflow with hash-pinned actionlint
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --retry 3 --max-time 60 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes= .github/workflows/*.yml
      - name: Select complete coverage for this change
        id: route
        env:
          CI_MODE: ${{ inputs.ref && 'release' || (github.event_name == 'pull_request' && 'pull_request' || (github.event_name == 'merge_group' && 'merge_group' || 'manual')) }}
          CI_BASE: ${{ github.event.pull_request.base.sha }}
          CI_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-routing.mjs

  light:
    needs: changes
    if: needs.changes.outputs.light == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify documentation, citations and every website contract
        run: |
          npm run citation:check
          npm run site:verify
          node --test scripts/test-cla.mjs scripts/test-cla-reminder.mjs

  quality:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies for static checks
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Restore incremental check caches
        uses: actions/cache@v6
        with:
          path: .ci/cache
          key: checks-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('package-lock.json', 'tsconfig*.json', 'electron/tsconfig.json', '.eslintrc.cjs', 'package.json') }}-${{ github.sha }}
          restore-keys: |
            checks-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('package-lock.json', 'tsconfig*.json', 'electron/tsconfig.json', '.eslintrc.cjs', 'package.json') }}-
      - name: Generate the current TypeScript contract sources
        run: npm run build:cloudflare
      - name: Lint
        run: npm run lint:ci
      - name: Typecheck renderer and Electron
        run: npm run typecheck:ci

  linux:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    outputs:
      artifact_id: ${{ steps.share-build.outputs.artifact-id }}
      plan_artifact_id: ${{ steps.share-plan.outputs.artifact-id }}
      node_version: ${{ steps.runtime.outputs.node_version }}
      marketplace_ref: ${{ steps.runtime.outputs.marketplace_ref }}
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      LIBGL_ALWAYS_SOFTWARE: 'true'
      NODUS_CI_COMPONENT_STYLES: .ci/component-styles.css
      NODUS_MARKETPLACE_DIR: ${{ format('{0}/.marketplace', github.workspace) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Verify citation metadata
        run: npm run citation:check
      - name: Install Linux test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y xvfb libgl1-mesa-dri libegl-mesa0 mesa-utils ffmpeg zsync libfuse2 libgtk-3-0 libnss3 libasound2
          ffmpeg -version >/dev/null
          ffprobe -version >/dev/null
          test -x /usr/bin/google-chrome
          xvfb-run --auto-servernum glxinfo -B
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Restore Electron download cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-${{ runner.arch }}-
      - name: Materialize Electron once and rebuild native modules
        # Match the proven Linux release toolchain; Electron 43 headers do not
        # compile with Ubuntu 22.04's default GCC.
        env:
          CC: clang-15
          CXX: clang++-15
        run: |
          node scripts/prepare-electron-tests.mjs
          npx electron-builder install-app-deps
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Build the current commit while static checks run independently
        run: npm run build:ci:bundle
      - name: Build the Server Web bundle
        run: npm run build:server-web
      - name: Compile component test styles
        run: node scripts/lib/component-test-styles.mjs prepare-ci
      - name: Checkout the marketplace
        uses: actions/checkout@v7
        with:
          repository: NodusResearch/nodus-research-skill-marketplace
          path: .marketplace
      - name: A pairing never reaches main or a release
        if: github.event_name != 'pull_request'
        run: test ! -f .github/marketplace-ref
      - name: Use the paired marketplace branch on a pull request
        if: github.event_name == 'pull_request'
        working-directory: .marketplace
        run: |
          set -euo pipefail
          REF_FILE="$GITHUB_WORKSPACE/.github/marketplace-ref"
          [ -f "$REF_FILE" ] || exit 0
          BRANCH=$(tr -d ' \t\r\n' < "$REF_FILE")
          [ -n "$BRANCH" ] && [ "$BRANCH" != main ] || exit 0
          git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null
          git fetch --depth 1 origin "$BRANCH"
          git checkout FETCH_HEAD
      - name: Pin the consumer runtime and marketplace revision
        id: runtime
        run: |
          echo "node_version=$(node -p 'process.versions.node')" >> "$GITHUB_OUTPUT"
          echo "marketplace_ref=$(git -C .marketplace rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Assign every test file to exactly one parallel group
        run: node scripts/ci-test-shards.mjs plan
      - name: Package this commit's build and Electron native runtime
        run: |
          node scripts/ci-build-artifact.mjs pack
          node scripts/ci-native-artifact.mjs pack
      - name: Share this run's verified build and complete test plan
        id: share-build
        uses: actions/upload-artifact@v7
        with:
          name: ci-build-${{ github.run_attempt }}
          path: |
            .ci/build.tgz
            .ci/build-manifest.json
            .ci/native.tgz
            .ci/native-manifest.json
            .ci/plan.json
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - name: Share the small plan separately for the final inventory gate
        id: share-plan
        uses: actions/upload-artifact@v7
        with:
          name: ci-plan-${{ github.run_attempt }}
          path: .ci/plan.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  unit:
    needs: [changes, linux]
    if: needs.changes.outputs.full == 'true'
    name: Linux tests (${{ matrix.shard }})
    strategy:
      # Every group must finish and report even if another group fails.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      LIBGL_ALWAYS_SOFTWARE: 'true'
      NODUS_CI_COMPONENT_STYLES: .ci/component-styles.css
      NODUS_MARKETPLACE_DIR: ${{ format('{0}/.marketplace', github.workspace) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/ci-linux
        with:
          artifact-id: ${{ needs.linux.outputs.artifact_id }}
          node-version: ${{ needs.linux.outputs.node_version }}
          marketplace-ref: ${{ needs.linux.outputs.marketplace_ref }}
      # Match the original hash-verified OCR resource rather than letting an
      # individual test fetch an unpinned language model.
      - name: Prepare hash-verified local OCR test resource
        run: node scripts/prepare-research-ocr-fixture.mjs
      - name: Every assigned unit and integration test passes
        run: xvfb-run --auto-servernum npm run test:ci:shard -- ${{ matrix.shard }}
      - name: Preserve this group's execution inventory, including failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          # On a failed-job rerun, replace only that group's report. Other
          # successful groups and the original build remain usable.
          name: ci-tests-${{ matrix.shard }}
          overwrite: true
          path: .ci/reports/shard-${{ matrix.shard }}.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  e2e:
    needs: [changes, linux]
    if: needs.changes.outputs.full == 'true'
    name: Real app (${{ matrix.group }})
    strategy:
      fail-fast: false
      matrix:
        group: [smoke, backups, integration]
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      LIBGL_ALWAYS_SOFTWARE: 'true'
      NODUS_MARKETPLACE_DIR: ${{ format('{0}/.marketplace', github.workspace) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/ci-linux
        with:
          artifact-id: ${{ needs.linux.outputs.artifact_id }}
          node-version: ${{ needs.linux.outputs.node_version }}
          marketplace-ref: ${{ needs.linux.outputs.marketplace_ref }}
      - name: Both repositories agree and signed packages install
        if: matrix.group == 'integration'
        run: npm run verify:cross-repo
      - name: Prepare hash-verified local OCR test resource
        if: matrix.group == 'integration'
        run: node scripts/prepare-research-ocr-fixture.mjs
      - name: Real AppImage update compatibility
        if: matrix.group == 'integration' && needs.changes.outputs.appimage == 'true'
        run: node scripts/verify-appimage-updates.mjs
      - name: Parallel Linux installer payload and updater contracts
        if: matrix.group == 'integration' && needs.changes.outputs.appimage == 'true'
        run: |
          sudo apt-get install --no-install-recommends -y libarchive-tools
          node scripts/verify-linux-release-formats.mjs
      - name: Native Linux Presenter controller
        if: matrix.group == 'integration' && needs.changes.outputs.presenter == 'true'
        run: xvfb-run --auto-servernum node scripts/verify-presenter-lan.cjs
      - name: Managed Research runtime, isolation and lifecycle
        if: matrix.group == 'integration' && needs.changes.outputs.research == 'true'
        run: node scripts/ci-native-checks.mjs research --no-synthetic
      - name: E2E smoke (real app boot)
        timeout-minutes: 10
        if: matrix.group == 'smoke'
        run: xvfb-run --auto-servernum bash -e -c 'npm run test:e2e'
      - name: Backups export and restore E2E
        timeout-minutes: 10
        if: matrix.group == 'backups'
        env:
          NODUS_BACKUPS_ARTIFACT_DIR: ${{ github.workspace }}/.ci/backups-e2e
        run: xvfb-run --auto-servernum npm run test:e2e:backups
      - name: Stellar canvas E2E
        timeout-minutes: 5
        if: matrix.group == 'smoke'
        run: xvfb-run --auto-servernum bash -e -c 'npm run test:e2e:stellar'
      - name: Graph tabs E2E
        timeout-minutes: 5
        if: matrix.group == 'smoke'
        run: xvfb-run --auto-servernum bash -e -c 'npm run test:e2e:stellar-tabs'
      - name: Argument map E2E
        timeout-minutes: 5
        if: matrix.group == 'smoke'
        run: xvfb-run --auto-servernum bash -e -c 'npm run test:e2e:argument-map'
      - name: Each package installs, migrates, registers and uninstalls
        if: matrix.group == 'integration'
        run: xvfb-run --auto-servernum npm run verify:capability-packages
      - name: Guided academic learning E2E
        timeout-minutes: 4
        if: matrix.group == 'integration'
        run: xvfb-run --auto-servernum node scripts/e2e-academic-learning.mjs
      - name: Isolated learning workspace E2E
        timeout-minutes: 4
        if: matrix.group == 'integration'
        run: xvfb-run --auto-servernum node scripts/e2e-learning-workspace.mjs
      - name: A 5.3.1 profile migrates, fails and retries
        if: matrix.group == 'integration'
        run: xvfb-run --auto-servernum npm run verify:capability-migration
      - name: Preserve real-app and native lifecycle diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-e2e-${{ matrix.group }}-${{ github.run_attempt }}
          overwrite: true
          path: |
            .ci/backups-e2e/*.png
            .ci/backups-e2e/verification.json
            research-runtime-lifecycle.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 3

  platform:
    needs: changes
    if: needs.changes.outputs.macos == 'true' || needs.changes.outputs.windows == 'true'
    name: Native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      NODUS_MARKETPLACE_DIR: ${{ format('{0}/.marketplace', github.workspace) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - name: Materialize Electron and its native dependencies
        run: |
          node scripts/prepare-electron-tests.mjs
          npx electron-builder install-app-deps
      - name: Native macOS APIs and real Python credentials cannot skip
        run: node scripts/ci-native-checks.mjs platform
      - name: Restore native-host incremental TypeScript caches
        uses: actions/cache@v6
        with:
          path: .ci/cache
          key: checks-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('package-lock.json', 'tsconfig*.json', 'electron/tsconfig.json', '.eslintrc.cjs', 'package.json') }}-${{ github.sha }}
          restore-keys: |
            checks-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('package-lock.json', 'tsconfig*.json', 'electron/tsconfig.json', '.eslintrc.cjs', 'package.json') }}-
      - name: Compile renderer and native entry points
        run: npm run build:ci
      - name: Checkout the marketplace
        uses: actions/checkout@v7
        with:
          repository: NodusResearch/nodus-research-skill-marketplace
          path: .marketplace
          persist-credentials: false
      - name: Use the paired marketplace branch on a pull request
        if: github.event_name == 'pull_request'
        shell: bash
        working-directory: .marketplace
        run: |
          set -euo pipefail
          REF_FILE="$GITHUB_WORKSPACE/.github/marketplace-ref"
          [ -f "$REF_FILE" ] || exit 0
          BRANCH=$(tr -d ' \t\r\n' < "$REF_FILE")
          [ -n "$BRANCH" ] && [ "$BRANCH" != main ] || exit 0
          git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null
          git fetch --depth 1 origin "$BRANCH"
          git checkout FETCH_HEAD
      - name: Signed native capabilities and profile migrations
        run: |
          npm run verify:cross-repo
          npm run verify:capability-packages
          npm run verify:capability-migration
      - name: Native Windows Presenter controller
        if: runner.os == 'Windows'
        run: node scripts/verify-presenter-lan.cjs
      - name: Managed native Research runtime and isolated real app
        if: needs.changes.outputs.research == 'true'
        run: node scripts/ci-native-checks.mjs research
      - uses: actions/upload-artifact@v7
        if: always() && needs.changes.outputs.research == 'true'
        with:
          name: research-native-${{ runner.os }}-${{ github.run_attempt }}
          path: research-runtime-lifecycle.json
          if-no-files-found: warn
          retention-days: 3

  scheme:
    needs: changes
    if: needs.changes.outputs.scheme == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/scheme-scan/requirements-ci.txt
      - run: python -m pip install -r tools/scheme-scan/requirements-ci.txt
      - name: Syntax and chemistry regressions
        run: |
          python -m compileall -q tools/scheme-scan tools/reaction-index
          python -m unittest discover -s tools/scheme-scan/tests -v
          python -m unittest discover -s tools/reaction-index -p 'test_builder_regressions.py' -v
          python tools/reaction-index/test_template_radius.py

  server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - name: Build the real server container without publishing
        run: docker build -f server/Dockerfile --build-arg NODUS_VERSION="$(node -p 'require("./package.json").version')" --build-arg NODUS_REVISION="$GITHUB_SHA" --tag nodus-server:ci .
      - name: Container boots, reports health and protects anonymous access
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker rm -f nodus-server-ci >/dev/null 2>&1 || true' EXIT
          docker run -d --name nodus-server-ci \
            -p 127.0.0.1:17443:7443 \
            -e NODUS_PUBLIC_URL=http://localhost:17443 \
            -e NODUS_ADMIN_EMAIL=ci-admin@example.test \
            -e NODUS_ADMIN_PASSWORD=ci-only-admin-password-123456 \
            nodus-server:ci
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:17443/healthz | grep --quiet '"ok":true'; then
              curl --fail --silent --head http://127.0.0.1:17443/ | grep --ignore-case --quiet '^location: /login'
              exit 0
            fi
            sleep 1
          done
          docker logs nodus-server-ci
          exit 1

  test:
    needs: [changes, quality, linux, unit, e2e, light, platform, scheme, server]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Every selected quality check must have succeeded
        env:
          CI_SELECTION: ${{ needs.changes.outputs.selection }}
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/ci-routing.mjs gate
      - name: Download this run's complete test plan
        if: needs.changes.outputs.full == 'true'
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.linux.outputs.plan_artifact_id }}
          path: .ci
          merge-multiple: true
      - name: Download all six execution reports
        if: needs.changes.outputs.full == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: ci-tests-*
          path: .ci/reports
          merge-multiple: true
      - name: Every discovered test file passed exactly once on this commit
        if: needs.changes.outputs.full == 'true'
        run: node scripts/ci-test-shards.mjs verify
