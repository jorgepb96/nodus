<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Local text-to-speech (Piper) and speech-to-text (Whisper) run in the renderer:
      'wasm-unsafe-eval' lets the WASM runtime compile, and the onnxruntime-web
      runtime + the Piper voice models are fetched on demand from their CDNs /
      Hugging Face (voices are then cached locally in OPFS and reused offline).
      media-src blob: lets generated and recorded clips play back from object URLs.
      frame-src is the ONE remote frame Nodus embeds: the video tutorials, on YouTube's
      no-cookie host (see shared/tutorialVideos.ts). Nothing loads it until the user
      opens a tutorial, and the written guide covers the same ground offline.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' blob: data: 'wasm-unsafe-eval' https://cdn.jsdelivr.net; worker-src 'self' blob:; child-src 'self' blob:; frame-src nodus-archive: nodus-library: https://www.youtube-nocookie.com; style-src 'self' 'unsafe-inline'; img-src 'self' nodus-image: nodus-archive: nodus-library: data: blob: https://*.tile.openstreetmap.org; font-src 'self' data:; media-src 'self' nodus-archive: nodus-library: nodus-audio: blob: data:; connect-src 'self' nodus-archive: nodus-library: https://huggingface.co https://*.huggingface.co https://*.hf.co https://*.xethub.hf.co https://cdn.jsdelivr.net"
    />
    <title>Nodus Research</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
