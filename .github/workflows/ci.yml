name: CI

# Temporary Actions budget restriction, requested 2026-10-11.
# Exact original workflow and GitHub settings: .github/actions-budget/.
# Restore only when the repository owner explicitly requests it.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Verify citation metadata
        run: npm run citation:check
      # The essential suite uses Node and mocks; skip native/Electron downloads
      # and rebuilds, which are only needed by the temporarily paused suites.
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Restore incremental check caches
        uses: actions/cache@v6
        with:
          path: .ci/cache
          key: checks-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('package-lock.json', 'tsconfig*.json', 'electron/tsconfig.json', '.eslintrc.cjs', 'package.json') }}-${{ github.sha }}
          restore-keys: |
            checks-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('package-lock.json', 'tsconfig*.json', 'electron/tsconfig.json', '.eslintrc.cjs', 'package.json') }}-
      - name: Lint
        run: npm run lint:ci
      - name: Build (includes typecheck)
        run: npm run build:ci
      - name: Essential concurrency contracts
        run: npm run test:adaptive-concurrency
      - name: Essential safety and core contracts
        run: |
          node --test --test-concurrency=2 \
            scripts/test-ci-quality-gate.mjs \
            scripts/test-ipc-contract.mjs \
            scripts/test-privacy-compliance.mjs \
            scripts/test-backup-password-policy.mjs \
            scripts/test-backup-file-streaming.mjs \
            scripts/test-sync-hlc.mjs \
            scripts/test-capability-api-v2.mjs
